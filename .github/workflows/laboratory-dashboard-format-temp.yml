name: Format laboratory dashboard source (temporary)
on:
  push:
    branches: [feat/laboratory-auth-cloudflare-preview]
    paths:
      - .github/workflows/laboratory-dashboard-format-temp.yml
      - app/features/laboratory-dashboard/**
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laboratory-auth-cloudflare-preview
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Prettier new lab dashboard routes
        run: |
          npx prettier --write app/features/laboratory-dashboard/laboratory-shell.tsx app/features/laboratory-dashboard/laboratory-dashboard.tsx app/features/laboratory-auth/page.tsx app/routes/lb-dashboard/dashboard/page.tsx app/routes/lb-dashboard/test-bookings/page.tsx
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- app/features/laboratory-dashboard app/features/laboratory-auth/page.tsx app/routes/lb-dashboard/dashboard app/routes/lb-dashboard/test-bookings; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/features/laboratory-dashboard app/features/laboratory-auth/page.tsx app/routes/lb-dashboard/dashboard app/routes/lb-dashboard/test-bookings
            git commit -m 'style(lab): format screenshot-matched dashboard'
            git push origin HEAD:feat/laboratory-auth-cloudflare-preview
          fi
