name: Hospital formatting diff (temporary)

on:
  push:
    branches:
      - feat/hospital-auth-cloudflare-preview

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Show Prettier patch without modifying the repository
        shell: bash
        run: |
          npx prettier --write app/features/hospital-dashboard/page.tsx app/features/hospital-dashboard/patient-details.tsx
          git diff --color=never -- app/features/hospital-dashboard/page.tsx app/features/hospital-dashboard/patient-details.tsx
