name: Format lab preview docs (temporary)
on:
  push:
    branches: [feat/laboratory-auth-cloudflare-preview]
    paths:
      - docs/laboratory-cloudflare-preview.md
      - .github/workflows/laboratory-docs-format-temporary.yml

permissions:
  contents: write

jobs:
  format-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laboratory-auth-cloudflare-preview
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Format lab preview docs
        run: npx prettier --write docs/laboratory-cloudflare-preview.md
      - name: Commit and push formatting
        run: |
          if ! git diff --quiet -- docs/laboratory-cloudflare-preview.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/laboratory-cloudflare-preview.md
            git commit -m 'style(lab): format Cloudflare Pages preview documentation'
            git push origin HEAD:feat/laboratory-auth-cloudflare-preview
          fi
