name: Validate and format lab dashboard (temporary)
on:
  push:
    branches: [feat/laboratory-auth-cloudflare-preview]
    paths:
      - .github/workflows/lab-dashboard-prettier-validate-temp.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laboratory-auth-cloudflare-preview
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npx prettier --write app/features/laboratory-dashboard/laboratory-dashboard.tsx
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:lb
      - name: Commit formatting
        if: success()
        run: |
          if ! git diff --quiet -- app/features/laboratory-dashboard/laboratory-dashboard.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/features/laboratory-dashboard/laboratory-dashboard.tsx
            git commit -m 'style(lab): normalize JSX entities and finish dashboard formatting'
            git push origin HEAD:feat/laboratory-auth-cloudflare-preview
          fi
