name: Laboratory interaction validation (temporary)
on:
  push:
    branches: [feat/laboratory-auth-cloudflare-preview]
    paths:
      - .github/workflows/laboratory-interaction-validate-temp.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned trusted action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/laboratory-auth-cloudflare-preview
          persist-credentials: false
      - name: Supply-chain scan before dependency installation
        run: bash scripts/security/supply-chain-scan.sh
      - name: Adversarial scanner tests before dependency installation
        run: bash scripts/security/supply-chain-scan.test.sh
      - name: Set up pinned Node action
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh lockfile without install scripts
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Format changed laboratory code
        run: |
          npx prettier --write \
            app/features/laboratory-dashboard/laboratory-staff.tsx \
            app/features/laboratory-dashboard/laboratory-catalogue.tsx \
            app/features/laboratory-dashboard/laboratory-profile.tsx \
            scripts/tests/laboratory-ui.test.tsx package.json \
            .github/workflows/ci.yml \
            .github/workflows/laboratory-preview.yml
      - name: Commit reviewed dependency lock and formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- package-lock.json package.json app/features/laboratory-dashboard/laboratory-staff.tsx app/features/laboratory-dashboard/laboratory-catalogue.tsx app/features/laboratory-dashboard/laboratory-profile.tsx scripts/tests/laboratory-ui.test.tsx .github/workflows/ci.yml .github/workflows/laboratory-preview.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json package.json app/features/laboratory-dashboard/laboratory-staff.tsx app/features/laboratory-dashboard/laboratory-catalogue.tsx app/features/laboratory-dashboard/laboratory-profile.tsx scripts/tests/laboratory-ui.test.tsx .github/workflows/ci.yml .github/workflows/laboratory-preview.yml
            git commit -m 'test(lab): lock audited UI test dependencies and format form migration'
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:feat/laboratory-auth-cloudflare-preview
          fi
      - name: Test lab helpers
        run: npm run test:lab
      - name: Test rendered UI (strict TS imports)
        run: npm run test:lab:ui
      - name: Audit dependency policy
        if: success() || failure()
        run: npm run test:audit-policy && npm run audit:dependencies
      - name: Enforce full formatting
        if: success() || failure()
        run: npm run format:check
      - name: Enforce zero-warning lint
        if: success() || failure()
        run: npm run lint -- --max-warnings=0
      - name: Type-check
        if: success() || failure()
        run: npm run typecheck
      - name: Build lab
        if: success() || failure()
        run: npm run build:lb
      - name: Build other portals
        if: success() || failure()
        run: npm run build:mp && npm run build:ph
