name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && vars.SSH_DEPLOY_ENABLED == 'true'
    timeout-minutes: 15

    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /var/www/ohealth/fe/staging
            git pull --ff-only origin staging
            docker compose -p ohealth-fe-staging --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f

  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.SSH_DEPLOY_ENABLED == 'true'
    timeout-minutes: 15

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /var/www/ohealth/fe/prod
            git pull --ff-only origin main
            docker compose -p ohealth-fe-prod --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f
