name: Format hospital preview (temporary)
on:
  push:
    branches:
      - feat/hospital-auth-cloudflare-preview
    paths:
      - app/features/hospital-dashboard/hospital-appointments.tsx
      - app/features/hospital-dashboard/hospital-profile.tsx
      - app/features/hospital-dashboard/page.tsx
      - .github/workflows/hospital-format-preview.yml

permissions:
  contents: write

jobs:
  format-hospital:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hospital-auth-cloudflare-preview
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format the three hospital files
        run: |
          npx prettier --write app/features/hospital-dashboard/hospital-appointments.tsx app/features/hospital-dashboard/hospital-profile.tsx app/features/hospital-dashboard/page.tsx
          git diff --stat
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- app/features/hospital-dashboard/hospital-appointments.tsx app/features/hospital-dashboard/hospital-profile.tsx app/features/hospital-dashboard/page.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/features/hospital-dashboard/hospital-appointments.tsx app/features/hospital-dashboard/hospital-profile.tsx app/features/hospital-dashboard/page.tsx
            git commit -m 'style(hospital): apply repository Prettier formatting'
            git push origin HEAD:feat/hospital-auth-cloudflare-preview
          fi
