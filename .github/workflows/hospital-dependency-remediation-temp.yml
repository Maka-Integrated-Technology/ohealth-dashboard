name: Hospital dependency remediation (temporary)
on:
  push:
    branches: [feat/hospital-auth-cloudflare-preview]
    paths:
      - .github/workflows/hospital-dependency-remediation-temp.yml
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/hospital-auth-cloudflare-preview
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Use npm 11 to avoid known npm 10 Arborist peer-resolution crash
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Regenerate lockfile for patched constraints
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          echo 'Patched package versions:'
          echo "Updated dependency versions:"
          npm ls @modelcontextprotocol/sdk compression follow-redirects hono postcss-selector-parser proxy-addr source-map-js vite --depth=8 2>&1 | tail -90 || true
          git diff --stat package.json package-lock.json
      - name: Check dependency audit policy (no bypass)
        run: npm run test:audit-policy && npm run audit:dependencies
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build hospital portal
        run: npm run build:hs
      - name: Commit safe dependency remediation
        if: success()
        shell: bash
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'fix(security): remediate vulnerable dependency versions for hospital PR'
            git push origin HEAD:feat/hospital-auth-cloudflare-preview
          fi
