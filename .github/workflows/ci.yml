name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run supply-chain security scan
        shell: bash
        run: bash scripts/security/supply-chain-scan.sh

      - name: Verify supply-chain scanner controls
        shell: bash
        run: bash scripts/security/supply-chain-scan.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Verify dependency audit policy
        run: npm run test:audit-policy

      - name: Verify hospital preview behaviors
        run: npm run test:hospital

      - name: Laboratory behavior regressions
        run: npm run test:lab

      - name: Laboratory rendered interaction regressions
        run: npm run test:lab:ui

      - name: Pharmacy dashboard regressions
        run: npm run test:pharmacy

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build medical professional portal
        run: npm run build

      - name: Build hospital portal
        run: npm run build:hs

      - name: Build pharmacy portal
        run: npm run build:ph

      - name: Audit dependencies
        run: npm run audit:dependencies
