name: Validate lab shared navigation and mobile refinements (temporary)
on:
  push:
    branches: [feat/laboratory-auth-cloudflare-preview]
    paths:
      - .github/workflows/lab-shared-nav-mobile-validation-temp.yml
permissions:
  contents: write
jobs:
  validate-laboratory-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laboratory-auth-cloudflare-preview
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Format lab screens
        run: npx prettier --write app/features/laboratory-dashboard/*.tsx app/routes/lb-dashboard/test-bookings/page.tsx
      - name: Check lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build lab portal
        run: npm run build:lb
      - name: Commit formatted source
        if: success()
        run: |
          if ! git diff --quiet -- app/features/laboratory-dashboard app/routes/lb-dashboard/test-bookings/page.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/features/laboratory-dashboard app/routes/lb-dashboard/test-bookings/page.tsx
            git commit -m 'style(lab): format shared Test Bookings navigation and compact mobile screens'
            git push origin HEAD:feat/laboratory-auth-cloudflare-preview
          fi
