# Temporary formatter for PR #48. Remove after the formatter finishes.
name: Hospital PR One-off Format

on:
  push:
    branches:
      - feat/hospital-auth-cloudflare-preview
    paths:
      - .github/workflows/hospital-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/hospital-auth-cloudflare-preview
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Format the four updated components
        run: |
          npx prettier --write app/features/hospital-dashboard/hospital-profile.tsx app/features/hospital-dashboard/hospital-settings.tsx app/features/hospital-dashboard/hospital-laboratory.tsx app/features/hospital-dashboard/hospital-prescriptions.tsx
      - name: Commit formatted files
        run: |
          git add app/features/hospital-dashboard/hospital-profile.tsx app/features/hospital-dashboard/hospital-settings.tsx app/features/hospital-dashboard/hospital-laboratory.tsx app/features/hospital-dashboard/hospital-prescriptions.tsx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(hospital): format reviewed form and filter changes"
            git push origin HEAD:feat/hospital-auth-cloudflare-preview
          fi
