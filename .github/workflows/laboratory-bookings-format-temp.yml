name: Format booking screenshots (temporary)
on:
  push:
    branches: [feat/laboratory-auth-cloudflare-preview]
    paths:
      - .github/workflows/laboratory-bookings-format-temp.yml
permissions:
  contents: write
jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laboratory-auth-cloudflare-preview
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Prettier laboratory booking screens
        run: |
          npx prettier --write app/features/laboratory-dashboard/laboratory-bookings-data.ts app/features/laboratory-dashboard/laboratory-booking-drawer.tsx app/features/laboratory-dashboard/laboratory-shell.tsx app/routes/lb-dashboard/test-bookings/page.tsx
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build laboratory portal
        run: npm run build:lb
      - name: Commit and push formatting
        if: success()
        run: |
          if ! git diff --quiet -- app/features/laboratory-dashboard app/routes/lb-dashboard/test-bookings/page.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/features/laboratory-dashboard/laboratory-bookings-data.ts app/features/laboratory-dashboard/laboratory-booking-drawer.tsx app/features/laboratory-dashboard/laboratory-shell.tsx app/routes/lb-dashboard/test-bookings/page.tsx
            git commit -m 'style(lab): format Figma test booking table and lifecycle screens'
            git push origin HEAD:feat/laboratory-auth-cloudflare-preview
          fi
