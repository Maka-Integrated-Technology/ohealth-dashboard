name: Format lab authentication preview (temporary)
on:
  push:
    branches: [feat/laboratory-auth-cloudflare-preview]
    paths:
      - app/features/laboratory-auth/**
      - app/routes/lb-dashboard/**
      - .github/workflows/laboratory-auth-format-temporary.yml

permissions:
  contents: write

jobs:
  format-laboratory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laboratory-auth-cloudflare-preview
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Run lab code formatter
        run: |
          npx prettier --write app/features/laboratory-auth/page.tsx app/routes/lb-dashboard/page.tsx app/routes/lb-dashboard/layout.tsx
          git diff --stat
      - name: Commit and push formatting
        run: |
          if ! git diff --quiet -- app/features/laboratory-auth/page.tsx app/routes/lb-dashboard/page.tsx app/routes/lb-dashboard/layout.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/features/laboratory-auth/page.tsx app/routes/lb-dashboard/page.tsx app/routes/lb-dashboard/layout.tsx
            git commit -m 'style(lab): format laboratory authentication and onboarding'
            git push origin HEAD:feat/laboratory-auth-cloudflare-preview
          fi
