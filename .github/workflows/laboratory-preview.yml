name: Laboratory Preview

on:
  pull_request:
    branches: [dev]
    paths:
      - app/features/laboratory-auth/**
      - app/features/laboratory-dashboard/**
      - app/routes/lb-dashboard/**
      - app/routes.ts
      - package.json
      - package-lock.json
      - .github/workflows/laboratory-preview.yml

permissions:
  contents: read

concurrency:
  group: laboratory-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laboratory-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run supply-chain security scan
        shell: bash
        run: bash scripts/security/supply-chain-scan.sh
      - name: Verify supply-chain scanner controls
        shell: bash
        run: bash scripts/security/supply-chain-scan.test.sh
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Verify audit policy tests
        run: npm run test:audit-policy
      - name: Test lab preview flows
        run: npm run test:lab
      - name: Check dependency policy
        run: npm run audit:dependencies
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type-check
        run: npm run typecheck
      - name: Build lab portal
        run: npm run build:lb
